<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đổi Mật Khẩu</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>body { font-family: 'Inter', sans-serif; }</style>
</head>
<body class="bg-slate-100 min-h-screen flex items-center justify-center p-4">

    <div class="max-w-md w-full bg-white rounded-2xl shadow-xl overflow-hidden border border-slate-200">
        <div class="bg-amber-600 px-6 py-6 text-white text-center">
            <h1 class="text-xl font-bold">Yêu Cầu Đổi Mật Khẩu</h1>
            <p class="text-amber-100 text-xs mt-1">Bạn phải đổi mật khẩu trước khi có thể truy cập các tính năng khác</p>
        </div>

        <div class="p-6">
            <div id="error-alert" class="hidden mb-4 p-3 bg-red-50 border-l-4 border-red-500 text-red-700 text-xs rounded"></div>
            <div id="success-alert" class="hidden mb-4 p-3 bg-green-50 border-l-4 border-green-500 text-green-700 text-xs rounded"></div>

            <form onsubmit="handleChangePassword(event)" class="space-y-4">
                <div>
                    <label class="block text-xs font-semibold text-slate-700 uppercase mb-1">Mật Khẩu Hiện Tại</label>
                    <input type="password" id="old-password" value="Hr@123456"
                           class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-700 uppercase mb-1">Mật Khẩu Mới (≥ 8 ký tự, gồm cả chữ và số)</label>
                    <input type="password" id="new-password" required placeholder="Nhập mật khẩu mới..."
                           class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-700 uppercase mb-1">Xác Nhận Mật Khẩu Mới</label>
                    <input type="password" id="confirm-password" required placeholder="Nhập lại mật khẩu mới..."
                           class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
                </div>

                <button type="submit" id="btn-submit"
                        class="w-full py-2.5 bg-blue-600 hover:bg-blue-700 text-white font-semibold rounded-lg text-sm transition shadow-md">
                    Xác Nhận Đổi Mật Khẩu
                </button>
            </form>

            <div class="mt-4 text-center">
                <button onclick="logout()" class="text-xs text-slate-400 hover:text-slate-600">Đăng xuất</button>
            </div>
        </div>
    </div>

    <script>
        async function handleChangePassword(e) {
            e.preventDefault();
            hideAlerts();

            const oldPassword = document.getElementById('old-password').value;
            const newPassword = document.getElementById('new-password').value;
            const confirmPassword = document.getElementById('confirm-password').value;
            const token = localStorage.getItem('accessToken');

            if (!token) {
                showError("Bạn chưa đăng nhập. Vui lòng đăng nhập lại.");
                setTimeout(() => window.location.href = '/login', 1500);
                return;
            }

            // Client validation: >= 8 ký tự, chữ và số
            const regex = /^(?=.*[A-Za-z])(?=.*\d).{8,}$/;
            if (!regex.test(newPassword)) {
                showError("Mật khẩu mới phải từ 8 ký tự trở lên, bao gồm cả chữ cái và chữ số!");
                return;
            }

            if (newPassword !== confirmPassword) {
                showError("Mật khẩu xác nhận không khớp!");
                return;
            }

            const btn = document.getElementById('btn-submit');
            btn.disabled = true;
            btn.textContent = 'Đang xử lý...';

            try {
                const response = await fetch('/auth/change-password', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`
                    },
                    body: JSON.stringify({ oldPassword, newPassword })
                });

                const data = await response.json();

                if (!response.ok) {
                    showError(data.message || 'Đổi mật khẩu thất bại.');
                    return;
                }

                showSuccess("Đổi mật khẩu thành công! Đang chuyển hướng về trang chủ...");
                setTimeout(() => {
                    window.location.href = '/dashboard';
                }, 1200);

            } catch (err) {
                showError("Lỗi kết nối máy chủ.");
            } finally {
                btn.disabled = false;
                btn.textContent = 'Xác Nhận Đổi Mật Khẩu';
            }
        }

        function logout() {
            localStorage.clear();
            window.location.href = '/login';
        }

        function showError(msg) {
            const el = document.getElementById('error-alert');
            el.textContent = msg;
            el.classList.remove('hidden');
        }

        function showSuccess(msg) {
            const el = document.getElementById('success-alert');
            el.textContent = msg;
            el.classList.remove('hidden');
        }

        function hideAlerts() {
            document.getElementById('error-alert').classList.add('hidden');
            document.getElementById('success-alert').classList.add('hidden');
        }
    </script>
</body>
</html>
