<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quên Mật Khẩu</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>body { font-family: 'Inter', sans-serif; }</style>
</head>
<body class="bg-slate-100 min-h-screen flex items-center justify-center p-4">

    <div class="max-w-md w-full bg-white rounded-2xl shadow-xl overflow-hidden border border-slate-200 p-8">
        <div class="text-center mb-6">
            <h1 class="text-2xl font-bold text-slate-800">Quên Mật Khẩu</h1>
            <p class="text-slate-500 text-sm mt-1">Nhập email doanh nghiệp của bạn để nhận liên kết đặt lại mật khẩu</p>
        </div>

        <div id="notice-alert" class="hidden mb-4 p-4 bg-blue-50 border-l-4 border-blue-500 text-blue-800 text-sm rounded"></div>

        <form id="forgot-form" onsubmit="handleForgotPassword(event)" class="space-y-4">
            <div>
                <label class="block text-xs font-semibold text-slate-700 uppercase mb-1">Email Đã Đăng Ký</label>
                <input type="email" id="forgot-email" required value="hr1@company.com" placeholder="email@company.com"
                       class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
            </div>

            <button type="submit" id="btn-submit"
                    class="w-full py-2.5 bg-blue-600 hover:bg-blue-700 text-white font-semibold rounded-lg text-sm transition shadow-md">
                Gửi Hướng Dẫn Đặt Lại
            </button>
        </form>

        <div class="mt-6 text-center text-sm">
            <a href="/login" class="text-blue-600 hover:underline font-medium">← Quay lại trang Đăng nhập</a>
        </div>
    </div>

    <script>
        async function handleForgotPassword(e) {
            e.preventDefault();
            const email = document.getElementById('forgot-email').value.trim();
            const btn = document.getElementById('btn-submit');
            const alertBox = document.getElementById('notice-alert');

            btn.disabled = true;
            btn.textContent = 'Đang xử lý...';

            try {
                const response = await fetch('/auth/forgot-password', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email })
                });

                const data = await response.json();

                // Luôn hiển thị thông báo thành công (bảo mật tránh dò email)
                alertBox.innerHTML = `
                    <div class="font-semibold mb-1">Yêu cầu đã được ghi nhận!</div>
                    <div class="text-xs">Nếu email tồn tại, hệ thống đã gửi liên kết khôi phục (hạn 30 phút).</div>
                    <div class="text-xs mt-2 text-slate-600 bg-white p-2 rounded border border-blue-200">
                        💡 <strong>Môi trường Local / Dev:</strong> Bạn có thể mở Terminal/Console của Backend để lấy trực tiếp liên kết reset token vừa sinh ra!
                    </div>
                `;
                alertBox.classList.remove('hidden');
                document.getElementById('forgot-form').classList.add('hidden');

            } catch (err) {
                alertBox.textContent = 'Lỗi kết nối máy chủ.';
                alertBox.classList.remove('hidden');
            } finally {
                btn.disabled = false;
                btn.textContent = 'Gửi Hướng Dẫn Đặt Lại';
            }
        }
    </script>
</body>
</html>
