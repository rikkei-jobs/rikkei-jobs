<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" fill="none">
  <!-- Layer 1: Canvas Boundary (24x24px) -->
  <rect x="0.5" y="0.5" width="23" height="23" stroke="#CBD5E1" stroke-width="0.5" stroke-dasharray="1 1" />
  
  <!-- Layer 2: Live Area (20x20px with 2px Optical Margin) -->
  <rect x="2" y="2" width="20" height="20" stroke="#94A3B8" stroke-width="0.75" />
  
  <!-- Layer 3: Center Alignment Axes -->
  <line x1="12" y1="0" x2="12" y2="24" stroke="#E2E8F0" stroke-width="0.5" />
  <line x1="0" y1="12" x2="24" y2="12" stroke="#E2E8F0" stroke-width="0.5" />
  <line x1="2" y1="2" x2="22" y2="22" stroke="#F1F5F9" stroke-width="0.5" stroke-dasharray="2 2" />
  <line x1="22" y1="2" x2="2" y2="22" stroke="#F1F5F9" stroke-width="0.5" stroke-dasharray="2 2" />
  
  <!-- Layer 4: Geometric Keylines -->
  <!-- Circular Keyline (diameter 20px) -->
  <circle cx="12" cy="12" r="10" stroke="#38BDF8" stroke-width="0.75" stroke-dasharray="2 1" />
  <!-- Square Keyline (18x18px, rx=2) -->
  <rect x="3" y="3" width="18" height="18" rx="2" stroke="#818CF8" stroke-width="0.75" stroke-dasharray="2 1" />
  <!-- Horizontal Rectangle Keyline (20x16px, rx=2) -->
  <rect x="2" y="4" width="20" height="16" rx="2" stroke="#34D399" stroke-width="0.75" stroke-dasharray="2 1" />
  <!-- Vertical Rectangle Keyline (16x20px, rx=2) -->
  <rect x="4" y="2" width="16" height="20" rx="2" stroke="#F472B6" stroke-width="0.75" stroke-dasharray="2 1" />
</svg>
