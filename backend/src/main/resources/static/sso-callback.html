<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Xử Lý Vé Đăng Nhập SSO - LMS</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>body { font-family: 'Inter', sans-serif; }</style>
</head>
<body class="bg-slate-100 min-h-screen flex items-center justify-center p-4">

    <div class="max-w-md w-full bg-white rounded-2xl shadow-xl p-8 border border-slate-200 text-center">
        <!-- Loading State -->
        <div id="loading-box" class="space-y-4">
            <div class="inline-block animate-spin rounded-full h-12 w-12 border-4 border-blue-600 border-t-transparent"></div>
            <h2 class="text-xl font-bold text-slate-800">Đang xác thực vé SSO từ LMS...</h2>
            <p class="text-slate-500 text-sm">Hệ thống đang kiểm tra tính hợp lệ và thời hạn vé (60 giây).</p>
        </div>

        <!-- Error State -->
        <div id="error-box" class="hidden space-y-4">
            <div class="w-12 h-12 rounded-full bg-red-100 text-red-600 flex items-center justify-center mx-auto text-2xl font-bold">✕</div>
            <h2 class="text-xl font-bold text-red-700">Xác Thực Thất Bại (401)</h2>
            <p id="error-message" class="text-slate-600 text-sm bg-red-50 p-3 rounded-lg border border-red-200"></p>
            <div class="pt-4">
                <a href="/login" class="inline-block px-5 py-2.5 bg-blue-600 hover:bg-blue-700 text-white font-medium text-sm rounded-lg transition">
                    Quay lại Trang Đăng Nhập
                </a>
            </div>
        </div>

        <!-- Success State -->
        <div id="success-box" class="hidden space-y-4">
            <div class="w-12 h-12 rounded-full bg-green-100 text-green-600 flex items-center justify-center mx-auto text-2xl font-bold">✓</div>
            <h2 class="text-xl font-bold text-green-700">Đăng Nhập Thành Công!</h2>
            <p id="user-info" class="text-slate-600 text-sm"></p>
            <p class="text-xs text-slate-400">Đang chuyển hướng về trang chủ theo vai trò...</p>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            const urlParams = new URLSearchParams(window.location.search);
            const ticket = urlParams.get('ticket');

            if (!ticket) {
                showError("Không tìm thấy tham số vé 'ticket' trong đường dẫn URL.");
                return;
            }

            try {
                const response = await fetch('/auth/sso', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ ticket })
                });

                const data = await response.json();

                if (!response.ok) {
                    showError(data.message || `Lỗi ${response.status}: Vé không hợp lệ, đã hết hạn (>60s) hoặc đã được sử dụng.`);
                    return;
                }

                // Lưu JWT Token và thông tin User
                localStorage.setItem('accessToken', data.accessToken);
                localStorage.setItem('user', JSON.stringify(data.user));

                showSuccess(data.user);

                setTimeout(() => {
                    window.location.href = '/dashboard';
                }, 1000);

            } catch (err) {
                showError("Lỗi kết nối đến máy chủ.");
            }
        });

        function showError(msg) {
            document.getElementById('loading-box').classList.add('hidden');
            document.getElementById('error-box').classList.remove('hidden');
            document.getElementById('error-message').textContent = msg;
        }

        function showSuccess(user) {
            document.getElementById('loading-box').classList.add('hidden');
            document.getElementById('success-box').classList.remove('hidden');
            document.getElementById('user-info').textContent = `Chào mừng ${user.fullName} (${user.role})`;
        }
    </script>
</body>
</html>
