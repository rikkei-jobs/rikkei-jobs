<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đặt Lại Mật Khẩu</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>body { font-family: 'Inter', sans-serif; }</style>
</head>
<body class="bg-slate-100 min-h-screen flex items-center justify-center p-4">

    <div class="max-w-md w-full bg-white rounded-2xl shadow-xl overflow-hidden border border-slate-200 p-8">
        <div class="text-center mb-6">
            <h1 class="text-2xl font-bold text-slate-800">Đặt Lại Mật Khẩu</h1>
            <p class="text-slate-500 text-sm mt-1">Nhập mật khẩu mới cho tài khoản của bạn</p>
        </div>

        <div id="error-alert" class="hidden mb-4 p-3 bg-red-50 border-l-4 border-red-500 text-red-700 text-xs rounded"></div>
        <div id="success-alert" class="hidden mb-4 p-4 bg-green-50 border-l-4 border-green-500 text-green-700 text-sm rounded"></div>

        <form id="reset-form" onsubmit="handleResetPassword(event)" class="space-y-4">
            <div>
                <label class="block text-xs font-semibold text-slate-700 uppercase mb-1">Mã Token Xác Thực</label>
                <input type="text" id="reset-token" readonly
                       class="w-full px-3 py-2 bg-slate-100 border border-slate-300 rounded-lg text-xs font-mono text-slate-600 focus:outline-none">
            </div>
            <div>
                <label class="block text-xs font-semibold text-slate-700 uppercase mb-1">Mật Khẩu Mới (≥ 8 ký tự, gồm chữ + số)</label>
                <input type="password" id="new-password" required placeholder="Nhập mật khẩu mới..."
                       class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
            </div>
            <div>
                <label class="block text-xs font-semibold text-slate-700 uppercase mb-1">Xác Nhận Mật Khẩu Mới</label>
                <input type="password" id="confirm-password" required placeholder="Nhập lại mật khẩu mới..."
                       class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
            </div>

            <button type="submit" id="btn-submit"
                    class="w-full py-2.5 bg-blue-600 hover:bg-blue-700 text-white font-semibold rounded-lg text-sm transition shadow-md">
                Lưu Mật Khẩu Mới
            </button>
        </form>

        <div class="mt-6 text-center text-sm">
            <a href="/login" class="text-blue-600 hover:underline font-medium">← Quay lại trang Đăng nhập</a>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // Lấy token từ path /reset-password/<token> hoặc query param ?token=...
            let token = new URLSearchParams(window.location.search).get('token');
            if (!token) {
                const pathParts = window.location.pathname.split('/');
                token = pathParts[pathParts.length - 1];
            }

            if (!token || token === 'reset-password') {
                showError("Không tìm thấy mã token trong liên kết! Vui lòng kiểm tra lại email.");
                document.getElementById('btn-submit').disabled = true;
                return;
            }

            document.getElementById('reset-token').value = token;
        });

        async function handleResetPassword(e) {
            e.preventDefault();
            hideAlerts();

            const token = document.getElementById('reset-token').value.trim();
            const newPassword = document.getElementById('new-password').value;
            const confirmPassword = document.getElementById('confirm-password').value;

            // Kiểm tra mật khẩu >= 8 ký tự, gồm cả chữ và số
            const regex = /^(?=.*[A-Za-z])(?=.*\d).{8,}$/;
            if (!regex.test(newPassword)) {
                showError("Mật khẩu mới phải từ 8 ký tự trở lên, gồm cả chữ cái và chữ số!");
                return;
            }

            if (newPassword !== confirmPassword) {
                showError("Mật khẩu xác nhận không khớp!");
                return;
            }

            const btn = document.getElementById('btn-submit');
            btn.disabled = true;
            btn.textContent = 'Đang xử lý...';

            try {
                const response = await fetch('/auth/reset-password', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ token, newPassword })
                });

                const data = await response.json();

                if (!response.ok) {
                    showError(data.message || 'Liên kết đặt lại mật khẩu đã hết hạn (30 phút) hoặc đã được sử dụng.');
                    return;
                }

                document.getElementById('reset-form').classList.add('hidden');
                const successBox = document.getElementById('success-alert');
                successBox.innerHTML = `
                    <div class="font-bold text-base mb-1">Thành Công!</div>
                    <p class="text-xs">Mật khẩu của bạn đã được cập nhật. Bạn có thể đăng nhập ngay bằng mật khẩu mới.</p>
                    <div class="mt-3">
                        <a href="/login" class="inline-block px-4 py-2 bg-green-700 hover:bg-green-800 text-white rounded text-xs font-semibold">
                            Đi đến Đăng nhập
                        </a>
                    </div>
                `;
                successBox.classList.remove('hidden');

            } catch (err) {
                showError("Lỗi kết nối máy chủ.");
            } finally {
                btn.disabled = false;
                btn.textContent = 'Lưu Mật Khẩu Mới';
            }
        }

        function showError(msg) {
            const el = document.getElementById('error-alert');
            el.textContent = msg;
            el.classList.remove('hidden');
        }

        function hideAlerts() {
            document.getElementById('error-alert').classList.add('hidden');
            document.getElementById('success-alert').classList.add('hidden');
        }
    </script>
</body>
</html>
