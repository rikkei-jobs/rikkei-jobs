    enabled: true
  api-docs:
    enabled: true

jwt:
  secret: dev-insecure-jwt-secret-key-rikkei-jobs-min-32-chars

logging:
  level:
    com.rikkei.jobs: DEBUG
    org.flywaydb: INFO
    org.springframework.security: DEBUG
