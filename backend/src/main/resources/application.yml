server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: rikkei-jobs-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:}

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/rikkeijobs}
    username: ${SPRING_DATASOURCE_USERNAME:rikkei_app}
    password: ${SPRING_DATASOURCE_PASSWORD:rikkei_secret}
    driver-class-name: org.postgresql.Driver
    hikari:
      connection-timeout: 5000
      maximum-pool-size: 10

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        format_sql: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-on-migrate: true

  mail:
    host: ${SPRING_MAIL_HOST:localhost}
    port: ${SPRING_MAIL_PORT:1025}

jwt:
  secret: ${JWT_SECRET:MySuperSecretKeyForJwtTokenGenerationLongEnough32Bytes}
  expiration-ms: ${JWT_EXPIRATION_MS:28800000}

external:
  api:
    base-url: ${EXTERNAL_BASE_URL:http://localhost:9000}
    service-key: ${EXTERNAL_SERVICE_KEY:dev-key}
    timeout-seconds: ${EXTERNAL_API_TIMEOUT:5}
    max-retries: 2

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
