spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
  flyway:
    locations: classpath:db/migration

jwt:
  secret: ${JWT_SECRET:}

app:
  frontend-url: ${APP_FRONTEND_URL:}
  mail:
    from: ${APP_MAIL_FROM:}

springdoc:
  swagger-ui:
    enabled: false
  api-docs:
    enabled: false

logging:
  structured:
    format:
      console: ecs
  level:
    com.rikkei.jobs: INFO
    org.springframework: WARN

management:
  endpoint:
    health:
      show-details: never
