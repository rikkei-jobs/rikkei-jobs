# ==============================================================================
# Rikkei Jobs Continuous Integration (CI) Workflow
# Task T022DB0 - Sprint 1 Skeleton, Shared Conventions & External Systems Mock
#
# Standards:
#   - actionlint compliant
#   - Pinned actions with exact release tags
#   - Parallelized test & lint gates for backend, frontend, mock, docker-compose
#   - Live container stack smoke test and E2E verification
# ==============================================================================

name: CI Pipeline

on:
  push:
    branches:
      - main
      - develop
      - 'feature/**'
  pull_request:
    branches:
      - main
      - develop

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ----------------------------------------------------------------------------
  # 1. Mock External Systems Test Gate
  # ----------------------------------------------------------------------------
  mock-test:
    name: Mock Service Tests & Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4.2.2

      - name: Setup Node.js 24 LTS
        uses: actions/setup-node@v4.2.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: mock/package-lock.json

      - name: Install dependencies & run test runner
        working-directory: mock
        run: |
          npm ci
          npm test

  # ----------------------------------------------------------------------------
  # 2. Frontend Quality Gates (Lint, Typecheck, Test, Build)
  # ----------------------------------------------------------------------------
  frontend-check:
    name: Frontend Quality Gates
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4.2.2

      - name: Setup Node.js 24 LTS
        uses: actions/setup-node@v4.2.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Run ESLint
        working-directory: frontend
        run: npm run lint

      - name: Run TypeScript Typecheck
        working-directory: frontend
        run: npm run typecheck

      - name: Run Vitest Unit Tests
        working-directory: frontend
        run: npm run test -- --run

      - name: Run Vite Production Build
        working-directory: frontend
        run: npm run build

  # ----------------------------------------------------------------------------
  # 3. Backend Quality Gates (Maven Build, Spotless, SpotBugs, Testcontainers, Tests)
  # ----------------------------------------------------------------------------
  backend-check:
    name: Backend Quality Gates
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4.2.2

      - name: Setup Java 25 LTS
        uses: actions/setup-java@v4.7.0
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Ensure executable permissions
        run: chmod +x backend/mvnw check.sh

      - name: Check Java code formatting with Spotless
        working-directory: backend
        run: ./mvnw spotless:check

      - name: Run SpotBugs static analysis
        working-directory: backend
        run: ./mvnw spotbugs:check

      - name: Run Maven compilation & tests (-Xlint:all -Werror)
        working-directory: backend
        run: ./mvnw clean test

  # ----------------------------------------------------------------------------
  # 4. Docker Compose Syntax & Multi-Container Build Gate
  # ----------------------------------------------------------------------------
  docker-compose-check:
    name: Docker Compose Config & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4.2.2

      - name: Prepare environment file from safe defaults
        run: cp .env.example .env

      - name: Validate Docker Compose configuration
        run: docker compose config

      - name: Build container images
        run: docker compose build

  # ----------------------------------------------------------------------------
  # 5. Clean Code Assertions & Non-Code Linters Gate
  # ----------------------------------------------------------------------------
  clean-code-and-linters:
    name: Code Hygiene & Security Leak Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4.2.2

      - name: Setup Node.js 24 for linters
        uses: actions/setup-node@v4.2.0
        with:
          node-version: 24

      - name: Setup Java 25 LTS for dynamic version resolution
        uses: actions/setup-java@v4.7.0
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Ensure executable permissions
        run: chmod +x backend/mvnw check.sh

      - name: Scan for machine-specific path leaks
        run: |
          FORBIDDEN_USER="$(printf '%s%s%s%s%s%s' 'k' 'i' 'r' 'i' 't' 'o')"
          FORBIDDEN_DIR="$(printf 'C:\x5cUsers')"
          FORBIDDEN_REGEX="${FORBIDDEN_USER}|${FORBIDDEN_DIR}"

          LEAKS=$(grep -rnE "$FORBIDDEN_REGEX" . \
            --exclude-dir=".git" \
            --exclude-dir="node_modules" \
            --exclude-dir="target" \
            --exclude-dir="dist" \
            --exclude-dir=".agents" \
            --exclude="check.sh" \
            --exclude="check.ps1" \
            --exclude=".github/workflows/ci.yml" 2>/dev/null || true)

          if [ -n "$LEAKS" ]; then
            echo "ERROR: Machine-specific paths leaked in repository:"
            echo "$LEAKS"
            exit 1
          fi
          echo "Machine-specific path scan passed."

      - name: Scan for lingering TODO or FIXME comments
        run: |
          TODOS=$(grep -rnE "\b(TODO|FIXME)\b" backend/src/main frontend/src mock \
            --exclude-dir="node_modules" \
            --exclude="data.json" \
            --exclude="README.md" 2>/dev/null || true)

          if [ -n "$TODOS" ]; then
            echo "ERROR: Lingering TODO comments found in production code:"
            echo "$TODOS"
            exit 1
          fi
          echo "Lingering TODO scan passed."

      - name: Scan for secret leaks & private keys
        run: |
          SECRETS=$(grep -rnE "(BEGIN (RSA|OPENSSH|EC|DSA) PRIVATE KEY|ghp_[A-Za-z0-9]{36}|xox[baprs]-[0-9]{12})" . \
            --exclude-dir=".git" \
            --exclude-dir="node_modules" \
            --exclude-dir="target" \
            --exclude-dir="dist" \
            --exclude-dir=".agents" \
            --exclude="check.sh" \
            --exclude="check.ps1" \
            --exclude=".github/workflows/ci.yml" 2>/dev/null || true)

          if [ -n "$SECRETS" ]; then
            echo "ERROR: Potential secrets or private keys leaked in repository:"
            echo "$SECRETS"
            exit 1
          fi
          echo "Secret leak scan passed."

      - name: Run Markdownlint
        run: |
          npx --yes markdownlint-cli2@0.24.0 "**/*.md" "#**/node_modules/**" "#**/target/**" "#**/dist/**" "#**/.agents/**"

      - name: Run CSpell with Vietnamese Dictionary
        run: |
          npx --yes --package cspell@10.4.1 --package @cspell/dict-vi-vn@3.0.7 cspell "**/*.{md,java,ts,tsx,js,mjs,sql,yml,json,jsonc}"

      - name: Run Version Table Drift Check
        run: node scripts/check-version-drift.mjs

      - name: Run Quality Gate Synchronization Check
        run: node scripts/check-gate-sync.mjs

      - name: Run Agent Configuration Sync & Validation Check
        run: |
          node scripts/sync-agent-config.mjs --check
          node scripts/validate-agent-config.mjs

      - name: Run Yamllint
        run: |
          docker run --rm -v "$PWD:/data" cytopia/yamllint:1-0.14 -c /data/.yamllint.yml /data

      - name: Run Hadolint
        run: |
          docker run --rm -v "$PWD:/repo" hadolint/hadolint:v2.15.1 hadolint /repo/backend/Dockerfile /repo/frontend/Dockerfile /repo/mock/Dockerfile

      - name: Run Actionlint
        run: |
          docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.12 .github/workflows/ci.yml

      - name: Run SQLFluff on Flyway Migrations
        run: |
          docker run --rm -v "$PWD:/repo" -w /repo sqlfluff/sqlfluff:4.5.0 lint backend/src/main/resources/db/migration

  # ----------------------------------------------------------------------------
  # 6. CI Smoke & Integration Test Gate
  # ----------------------------------------------------------------------------
  smoke-test:
    name: Docker Compose Full Stack Smoke & E2E Verification
    runs-on: ubuntu-latest
    needs: [mock-test, frontend-check, backend-check, docker-compose-check, clean-code-and-linters]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4.2.2

      - name: Setup Node.js 24 LTS for E2E runner
        uses: actions/setup-node@v4.2.0
        with:
          node-version: 24

      - name: Prepare environment configuration
        run: cp .env.example .env

      - name: Spin up multi-container stack with health gates
        run: docker compose up -d --build --wait

      - name: Assert Database Migration State via psql (Flyway V1 + V2)
        run: |
          echo "Verifying Flyway schema history..."
          MIGRATIONS=$(docker compose exec -T postgres psql -U rikkei_app -d rikkeijobs -t -A -c "SELECT count(*) FROM flyway_schema_history WHERE success = true;")
          if [ "$MIGRATIONS" -lt 2 ]; then
            echo "ERROR: Expected at least 2 successful Flyway migrations, found $MIGRATIONS"
            exit 1
          fi
          echo "Flyway migrations verified: $MIGRATIONS applied."

      - name: Assert Seed Data in Dev Profile (Exactly 8 Users, 20 Skills)
        run: |
          USERS_COUNT=$(docker compose exec -T postgres psql -U rikkei_app -d rikkeijobs -t -A -c "SELECT count(*) FROM users;")
          if [ "$USERS_COUNT" -ne 8 ]; then
            echo "ERROR: Expected exactly 8 seed users, got $USERS_COUNT"
            exit 1
          fi
          SKILLS_COUNT=$(docker compose exec -T postgres psql -U rikkei_app -d rikkeijobs -t -A -c "SELECT count(*) FROM skills;")
          if [ "$SKILLS_COUNT" -ne 20 ]; then
            echo "ERROR: Expected exactly 20 skills, got $SKILLS_COUNT"
            exit 1
          fi
          echo "Database seed asserted: 8 users and 20 skills verified."

      - name: Assert Backend Health Endpoint
        run: |
          HEALTH_STATUS=$(curl -s -f http://127.0.0.1:8080/api/v1/health | grep -o '"status":"UP"' || true)
          if [ -z "$HEALTH_STATUS" ]; then
            echo "ERROR: Backend health endpoint did not return UP"
            curl -i http://127.0.0.1:8080/api/v1/health || true
            exit 1
          fi
          echo "Backend health status verified: UP"

      - name: Assert Frontend HTTP Accessibility
        run: |
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:3000/)
          if [ "$HTTP_CODE" -ne 200 ]; then
            echo "ERROR: Frontend returned HTTP $HTTP_CODE, expected 200"
            exit 1
          fi
          echo "Frontend asserted: HTTP 200 OK"

      - name: Assert Mock External Authentication Security Gate
        run: |
          UNAUTH_CODE=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:9000/lms/courses)
          if [ "$UNAUTH_CODE" -ne 401 ]; then
            echo "ERROR: Mock request without X-Service-Key expected 401, got $UNAUTH_CODE"
            exit 1
          fi
          AUTH_CODE=$(curl -s -o /dev/null -w "%{http_code}" -H "X-Service-Key: dev-key" http://127.0.0.1:9000/lms/courses)
          if [ "$AUTH_CODE" -ne 200 ]; then
            echo "ERROR: Mock request with valid key expected 200, got $AUTH_CODE"
            exit 1
          fi
          echo "Mock service authentication gates asserted: 401 on missing key, 200 on valid key."

      - name: Execute End-to-End Test Suite
        run: node e2e/run-all.mjs

      - name: Teardown Docker Compose Environment
        if: always()
        run: docker compose down -v
