# ==============================================================================
# Docker Compose Configuration for Rikkei Jobs Platform
# Project Name: rikkei-jobs
#
# Services:
#   1. postgres  - PostgreSQL 18.6 Alpine Database (Port 5433 -> 5432)
#   2. mock      - External Systems Mock Server (Port 9000)
#   3. mailpit   - Email Testing SMTP & Web UI (Port 8025 UI, 1025 SMTP)
#   4. backend   - Spring Boot 4.1.2 Java 25 Modular Monolith (Port 8080)
#   5. frontend  - React 19 + TypeScript + Vite + Nginx Non-root (Port 3000 -> 8080)
#
# Security Rules:
#   - All published ports strictly bound to 127.0.0.1 (Loopback only)
#   - All images pinned to exact versions (no 'latest' tag)
#   - Healthcheck on every service with condition: service_healthy gates
# ==============================================================================

name: rikkei-jobs

services:
  # ----------------------------------------------------------------------------
  # 1. PostgreSQL Database Service
  # ----------------------------------------------------------------------------
  postgres:
    image: postgres:18.6-alpine
    container_name: rikkei-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-rikkeijobs}
      POSTGRES_USER: ${POSTGRES_USER:-rikkei_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-rikkei_secret}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-rikkei_app} -d ${POSTGRES_DB:-rikkeijobs}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - rikkei-network

  # ----------------------------------------------------------------------------
  # 2. External Systems Mock Service (Node.js 24 + Express 5.3.0)
  # ----------------------------------------------------------------------------
  mock:
    build:
      context: ./mock
      dockerfile: Dockerfile
    container_name: rikkei-mock
    restart: unless-stopped
    environment:
      PORT: 9000
      SERVICE_KEY: ${EXTERNAL_SERVICE_KEY:-dev-key}
    ports:
      - "127.0.0.1:${MOCK_PORT:-9000}:9000"
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:9000/mock/requests || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s
    networks:
      - rikkei-network

  # ----------------------------------------------------------------------------
  # 3. Mailpit Mock Email Service (SMTP & Web UI)
  # ----------------------------------------------------------------------------
  mailpit:
    image: axllent/mailpit:v1.33.1
    container_name: rikkei-mailpit
    restart: unless-stopped
    ports:
      - "127.0.0.1:${MAILPIT_UI_PORT:-8025}:8025"
      - "127.0.0.1:${MAILPIT_SMTP_PORT:-1025}:1025"
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:8025/api/v1/info || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s
    networks:
      - rikkei-network

  # ----------------------------------------------------------------------------
  # 4. Backend Modular Monolith Service (Spring Boot 4.1.2 + Java 25 LTS)
  # ----------------------------------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: rikkei-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      mock:
        condition: service_healthy
      mailpit:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
      SERVER_PORT: 8080
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-rikkeijobs}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-rikkei_app}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-rikkei_secret}
      EXTERNAL_BASE_URL: ${EXTERNAL_BASE_URL:-http://mock:9000}
      EXTERNAL_SERVICE_KEY: ${EXTERNAL_SERVICE_KEY:-dev-key}
      SPRING_MAIL_HOST: ${SPRING_MAIL_HOST:-mailpit}
      SPRING_MAIL_PORT: ${SPRING_MAIL_PORT:-1025}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
      JWT_SECRET: ${JWT_SECRET:-dev-insecure-jwt-secret-key-rikkei-jobs-min-32-chars}
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:8080/api/v1/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - rikkei-network

  # ----------------------------------------------------------------------------
  # 5. Frontend Single Page Application (React 19 + TypeScript + Vite + Nginx)
  # ----------------------------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: rikkei-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-3000}:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 --spider http://127.0.0.1:8080/ || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    networks:
      - rikkei-network

# ------------------------------------------------------------------------------
# Volumes & Networks Definition
# ------------------------------------------------------------------------------
volumes:
  postgres_data:
    name: rikkei_postgres_data

networks:
  rikkei-network:
    name: rikkei-network
    driver: bridge
