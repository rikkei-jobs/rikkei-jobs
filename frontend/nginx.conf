worker_processes auto;
pid /tmp/nginx.pid;
error_log /var/log/nginx/error.log warn;

events {
    worker_connections 2048;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Temp directories writable by unprivileged nginx user
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path       /tmp/proxy_temp;
    fastcgi_temp_path     /tmp/fastcgi_temp;
    uwsgi_temp_path       /tmp/uwsgi_temp;
    scgi_temp_path        /tmp/scgi_temp;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    # Dynamic Docker DNS resolution with shared upstream zone preserves keepalive pooling
    # while refreshing backend container IP changes within <= 5s without restarting Nginx.
    resolver 127.0.0.11 valid=5s ipv6=off;
    resolver_timeout 2s;

    # Persistent HTTP/1.1 keepalive pool to backend avoids ephemeral port exhaustion under load
    upstream backend_upstream {
        zone backend_upstream 64k;
        server backend:8080 resolve;
        keepalive 64;
        keepalive_requests 10000;
        # Intentionally shorter than Tomcat app.server.tomcat.keep-alive-timeout-ms (65000 ms,
        # ServerCapacityConfig.java) so Nginx closes idle keepalive connections first.
        keepalive_timeout 60s;
    }

    # Gzip compression for optimized SPA delivery
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml;

    server {
        # Listen on port 8080 inside container (non-root standard)
        listen 8080;
        server_name localhost;

        root /usr/share/nginx/html;
        index index.html;

        # Explicitly deny access to hidden files (.git, .env, .env.js, etc.) before static regexes
        location ~ /\. {
            deny all;
            add_header X-Content-Type-Options "nosniff" always;
            access_log off;
            log_not_found off;
        }

        # Serve Single Page Application with route fallback to index.html
        location / {
            add_header Cache-Control "no-cache" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header X-Frame-Options "DENY" always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;
            add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
            add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data: blob: https://res.cloudinary.com; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none';" always;
            try_files $uri $uri/ /index.html;
        }

        # Immutable cache policy for Vite content-hashed bundles under /assets/
        location ^~ /assets/ {
            access_log off;
            add_header Cache-Control "public, max-age=31536000, immutable" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header X-Frame-Options "DENY" always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        }

        # Cache control for unhashed static assets (/fonts/, favicons, etc.)
        location ~* \.(?:css|js|jpg|jpeg|gif|png|ico|cur|gz|svg|svgz|mp4|ogg|ogv|webm|htc|woff|woff2)$ {
            access_log off;
            add_header Cache-Control "public, max-age=2592000" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header X-Frame-Options "DENY" always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        }

        # Reverse proxy to backend API via persistent upstream keepalive pool
        location ^~ /api/ {
            client_max_body_size 3m;
            error_page 413 @api_payload_too_large;
            proxy_pass http://backend_upstream;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 5s;
            proxy_read_timeout 60s;
            proxy_hide_header X-Powered-By;
        }

        location @api_payload_too_large {
            default_type application/json;
            add_header X-Content-Type-Options "nosniff" always;
            return 413 '{"code":"PAYLOAD_TOO_LARGE","message":"Kích thước tệp vượt quá giới hạn tối đa 2 MB"}';
        }

        # NOTE: SECURITY POLICY - NEVER proxy or route to Mock service.
        # Service keys and mock internal endpoints must never be reachable through the frontend.
    }
}
